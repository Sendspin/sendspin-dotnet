name: Interop

# Live interop against the aiosendspin reference server. Kept separate from the core
# build so its Python/network requirements never gate the unit-test workflow.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Pinned to the latest aiosendspin release, so CI exercises what servers actually
      # ship. Bump this deliberately when a new release lands: a release is where a spec
      # wire change first becomes observable, and the SDK's deliberate wire deviations are
      # held only until the reference server adopts them.
      #
      # 9.0.0 is the pairing floor, not the pin. It is the first release implementing spec
      # 5b0e6469 (spec PR #130): the server/activate 'pairing' object, pin_length validated
      # at the activation, the pairing window, client/pair-pending and
      # management/open-pairing-window. 7.0.0 and 8.0.0 both still send the flat
      # selected_pair_method, so a client conforming to the current spec cannot pair with
      # them at all — the pairing scenario fails with "Cannot offer pair method (null)".
      # Unpaired connect still works against 7.0.0. The split floor (playback >= 7.0.0,
      # pairing >= 9.0.0) is documented in the README compatibility matrix; pinning above
      # it means neither floor is exercised here any more.
      - name: Install aiosendspin reference server
        run: pip install "aiosendspin[server]==9.1.1"

      - name: Build interop client
        run: dotnet build tools/interop/InteropClient -c Release

      - name: Unpaired connect (client admitted over unpaired access)
        run: bash tools/interop/run.sh unpaired

      - name: Pairing PSK round-trip (pair, persist, re-handshake to user trust)
        run: bash tools/interop/run.sh pairing

      # The only live cover for the CPace round, PSK wrapping, and the pairing window. The
      # server side fails the run if the client did not gesture-gate the attempt first, so
      # this also pins the gating policy rather than just "pairing worked".
      - name: Static PIN round-trip (gesture-gated attempt, CPace, wrapped PSK)
        run: bash tools/interop/run.sh static-pin

      # Slower than the others by design: the client withholds its initial client/state
      # until clock sync converges, which takes ~30s of burst sampling, and the server
      # discards source chunks until that state arrives.
      - name: Source streaming (server start command, client_stream/start, decoded audio)
        run: bash tools/interop/run.sh source
