name: Interop

# Live interop against the aiosendspin reference server. Kept separate from the core
# build so its Python/network requirements never gate the unit-test workflow.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Pinned to the aiosendspin commit the 10.0.0 draft release targets, because this
      # line's pairing wire (object-keyed pair_methods, dynamic_pairing_code /
      # static_pairing_code, fixed code lengths, the emission format on server/activate)
      # exists only there: 9.1.1, the latest published release, rejects the client/hello
      # outright. Move this to "aiosendspin[server]==10.0.0" the moment it is published, and
      # thereafter bump deliberately on each release, since a release is where a spec wire
      # change first becomes observable. As of the 1.0 wire cut-over (#287) the SDK is AHEAD
      # of this pinned draft commit: it sends client-stream/* (spec PR #163), output_delay_ms /
      # set_output_delay (#164), drops trust_level (#158) and player supported_commands (#177)
      # from client/hello, and frames fragments as binary ID 1 (#172). The source scenario
      # below is skipped until aiosendspin adopts the client-stream/* rename. The 9.x line
      # keeps its own pin on 9.1.1.
      #
      # The compatibility floor is a single one — the aiosendspin 10.0.0 line — and is
      # documented in the README matrix, not exercised here: this job runs only against the
      # pinned draft commit above, patched below to accept the object-keyed pair methods.
      - name: Install aiosendspin reference server
        run: pip install "aiosendspin[server] @ git+https://github.com/Sendspin/aiosendspin@892af8c87b453442600a4d17f9eb32862fdb5593"

      # The reference server still declares supported_pair_methods as a list of
      # descriptors; the spec (PR #179) keys them by method, which is what the SDK sends.
      # Until aiosendspin adopts the object shape, teach the installed copy to accept it.
      - name: Accept the spec's object-keyed pair methods in the reference server
        run: python tools/interop/patch_aiosendspin_pair_methods.py

      - name: Build interop client
        run: dotnet build tools/interop/InteropClient -c Release

      - name: Unpaired connect (client admitted over unpaired access)
        run: bash tools/interop/run.sh unpaired

      - name: Pairing PSK round-trip (pair, persist, re-handshake to user trust)
        run: bash tools/interop/run.sh pairing

      # The only live cover for the CPace round, PSK wrapping, and the pairing window. The
      # server side fails the run if the client did not gesture-gate the attempt first, so
      # this also pins the gating policy rather than just "pairing worked".
      - name: Static PIN round-trip (gesture-gated attempt, CPace, wrapped PSK)
        run: bash tools/interop/run.sh static-pin

      # Slower than the others by design: the client withholds its initial client/state
      # until clock sync converges, which takes ~30s of burst sampling, and the server
      # discards source chunks until that state arrives.
      #
      # Skipped for the 1.0 wire cut-over (#287): the SDK now announces client-stream/start
      # (spec PR #163), but this pinned draft server still expects client_stream/start and so
      # never starts the stream. Re-enable when aiosendspin adopts the client-stream/* rename.
      - name: Source streaming (server start command, client-stream/start, decoded audio)
        if: false
        run: bash tools/interop/run.sh source
