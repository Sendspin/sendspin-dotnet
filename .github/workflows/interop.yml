name: Interop

# Live interop against the aiosendspin reference server. Kept separate from the core
# build so its Python/network requirements never gate the unit-test workflow.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Pinned to the published aiosendspin release that implements the 1.0.0-rc1 wire, the
      # same one Music Assistant ships. Bump deliberately on each release: a release is where a
      # spec wire change first becomes observable. The 9.x line keeps its own pin on 9.1.1.
      - name: Install aiosendspin reference server
        run: pip install "aiosendspin[server]==10.0.0"

      - name: Build interop client
        run: dotnet build tools/interop/InteropClient -c Release

      - name: Unpaired connect (client admitted over unpaired access)
        run: bash tools/interop/run.sh unpaired

      - name: Pairing PSK round-trip (pair, persist, re-handshake to user trust)
        run: bash tools/interop/run.sh pairing

      # The only live cover for the CPace round, PSK wrapping, and the pairing window. The
      # server side fails the run if the client did not gesture-gate the attempt first, so
      # this also pins the gating policy rather than just "pairing worked".
      - name: Static pairing code round-trip (gesture-gated attempt, CPace, wrapped PSK)
        run: bash tools/interop/run.sh static-pin

      # The code does not exist until the attempt is under way: the client derives it and
      # shows it, and the harness relays it to the server as an operator would type it in.
      - name: Dynamic pairing code round-trip (client-emitted code, CPace, wrapped PSK)
        run: bash tools/interop/run.sh dynamic-pin

      # The only live cover for the player role's stream/start and stream/end, and for the
      # 13-byte audio chunk header: every sample the server sends has to come out of the
      # client's decoder. Also fails if the server logs the client's initial client/state
      # as late, which it does after 5 s.
      - name: Player audio (stream/start, audio chunks with send_ahead, stream/end)
        run: bash tools/interop/run.sh player

      # Slower than the others by design: the client withholds its initial client/state
      # until clock sync converges, which takes about two seconds of burst sampling, and the server
      # discards source chunks until that state arrives.
      - name: Source streaming (server start command, client-stream/start, decoded audio)
        run: bash tools/interop/run.sh source
