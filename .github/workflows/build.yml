name: Build

on:
  push:
    # release/** covers the maintained legacy lines (release/9.3 and any successor).
    # Those branches never merge to main, so without this they are never built by CI.
    # Only the build job runs for them: publish is gated on refs/tags/v below, which a
    # branch push cannot satisfy.
    branches: [main, 'release/**']
    tags: ['v*.*.*']
  pull_request:
    # release/** here means a PR into a release line gets CI — but only once the release
    # branch's own copy of this file carries it, because pull_request runs the base
    # branch's workflow definition.
    branches: [main, 'release/**']

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.VERSION }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Release: version from tag (v7.3.0 → 7.3.0)
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # Branch push (no tag): use csproj version
            VERSION=$(grep -oP '<Version>\K[^<]+' src/Sendspin.SDK/Sendspin.SDK.csproj)
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal

      - name: Pack
        if: github.event_name == 'push'
        run: dotnet pack src/Sendspin.SDK/Sendspin.SDK.csproj -c Release --no-build -o artifacts -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Upload NuGet package
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

  aot:
    # Proves the NativeAOT claim instead of inferring it from analyzer warnings. The trim/AOT
    # analyzers only see this repo's IL and cannot speak for a dependency; Noise.NET sits on
    # the mandatory transport, so the only real check is publishing and running (#89).
    # The smoke test project sets WarningsAsErrors for the IL* diagnostics, so a new
    # reflection path fails this job rather than accumulating silently.
    #
    # arm64 is not redundant with x64. Noise.NET P/Invokes libsodium, and the libsodium build
    # it declares a floor on (1.0.16) ships no ARM binaries at all, so before the direct pin to
    # 1.0.22 every ARM consumer hit DllNotFoundException inside the handshake — invisible to an
    # x64-only job. This leg is what keeps that from silently reopening if the pin is dropped
    # or floated back down (#89, #144). The smoke test's cipher-suite check now runs a real
    # Curve25519 + AEAD operation through libsodium rather than querying the BCL, so simply
    # running the binary here exercises the native path end to end.
    name: NativeAOT publish (${{ matrix.rid }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: linux-arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install native toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish NativeAOT
        run: dotnet publish tools/AotSmokeTest/AotSmokeTest.csproj -c Release -r ${{ matrix.rid }}

      - name: Run the native binary
        run: ./tools/AotSmokeTest/bin/Release/net10.0/${{ matrix.rid }}/publish/AotSmokeTest

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      id-token: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: artifacts

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Push to GitHub Packages
        run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{ secrets.GITHUB_TOKEN }} --source https://nuget.pkg.github.com/Sendspin/index.json --skip-duplicate

      - name: Extract tag message
        id: tag-message
        run: |
          # Check if this is an annotated tag (objecttype=tag) vs lightweight (objecttype=commit)
          OBJ_TYPE=$(git for-each-ref --format='%(objecttype)' "refs/tags/${{ github.ref_name }}" 2>/dev/null || true)
          if [ "$OBJ_TYPE" = "tag" ]; then
            # Extract the annotated tag body (excludes subject line duplication)
            TAG_MSG=$(git for-each-ref --format='%(contents)' "refs/tags/${{ github.ref_name }}")
            if [ -n "$TAG_MSG" ]; then
              echo "$TAG_MSG" > /tmp/release-notes.md
              echo "has_notes=true" >> $GITHUB_OUTPUT
            else
              echo "has_notes=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "has_notes=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release (with notes)
        if: steps.tag-message.outputs.has_notes == 'true'
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release-notes.md
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg

      - name: Create GitHub Release (auto-generated)
        if: steps.tag-message.outputs.has_notes != 'true'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg
